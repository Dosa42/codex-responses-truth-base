name: one-shot-three-files

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  reset:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Replace repository with exactly three uploaded files
        shell: bash
        run: |
          set -euo pipefail
          COMMIT='1665a18fe20217c989c66dd73888345c6e4eb63c'
          BASE="https://raw.githubusercontent.com/openai/openai-openapi/${COMMIT}"

          curl -fL "$BASE/openapi.json" -o openapi.json
          curl -fL "$BASE/openapi.yaml" -o openapi.yaml
          curl -fL "$BASE/README.md" -o README.md

          test "$(git hash-object openapi.json)" = 'ee0b1aeb809bdfeee4ad292c8f7a73da6b0aa2d4'
          test "$(git hash-object openapi.yaml)" = '72558ff11a20f26db91b1d90abc4ebd3a185eb7e'
          test "$(git hash-object README.md)" = '4ecd4faaa73cc88ca6ba5321bd039fcf50171d65'

          find . -mindepth 1 -maxdepth 1 \
            ! -name '.git' \
            ! -name 'openapi.json' \
            ! -name 'openapi.yaml' \
            ! -name 'README.md' \
            -exec rm -rf {} +

          git config user.name 'three-file-reset'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git commit -m 'Keep only OpenAPI JSON YAML and README'
          git push
