name: bootstrap-reference

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Download official OpenAI files and extract Responses JSON
        run: |
          python - <<'PY'
          from pathlib import Path
          import json, urllib.request

          root = Path('.')
          OPENAPI_COMMIT = '1665a18fe20217c989c66dd73888345c6e4eb63c'
          CODEX_COMMIT = '7c3747941a6b664c30f1e6aa72a917fd74dc22d2'

          downloads = {
              'official/openapi/openapi.json': f'https://raw.githubusercontent.com/openai/openai-openapi/{OPENAPI_COMMIT}/openapi.json',
              'official/docs/gpt-5.6-sol.md': 'https://developers.openai.com/api/docs/models/gpt-5.6-sol.md',
              'official/docs/responses.md': 'https://developers.openai.com/api/docs/guides/migrate-to-responses.md',
              'official/docs/hosted-shell.md': 'https://developers.openai.com/api/docs/guides/tools-shell.md',
              'official/docs/code-interpreter.md': 'https://developers.openai.com/api/docs/guides/tools-code-interpreter.md',
              'official/docs/skills.md': 'https://developers.openai.com/api/docs/guides/tools-skills.md',
              'official/docs/multi-agent.md': 'https://developers.openai.com/api/docs/guides/responses-multi-agent.md',
              'official/docs/mcp-connectors.md': 'https://developers.openai.com/api/docs/guides/tools-connectors-mcp.md',
              'official/docs/tool-search.md': 'https://developers.openai.com/api/docs/guides/tools-tool-search.md',
              'official/docs/programmatic-tool-calling.md': 'https://developers.openai.com/api/docs/guides/tools-programmatic-tool-calling.md',
              'official/docs/codex-hooks.md': 'https://developers.openai.com/codex/hooks.md',
              'official/codex/login/server.rs': f'https://raw.githubusercontent.com/openai/codex/{CODEX_COMMIT}/codex-rs/login/src/server.rs',
              'official/codex/login/pkce.rs': f'https://raw.githubusercontent.com/openai/codex/{CODEX_COMMIT}/codex-rs/login/src/pkce.rs',
              'official/codex/login/auth-manager.rs': f'https://raw.githubusercontent.com/openai/codex/{CODEX_COMMIT}/codex-rs/login/src/auth/manager.rs',
              'official/codex/model-provider-info.rs': f'https://raw.githubusercontent.com/openai/codex/{CODEX_COMMIT}/codex-rs/model-provider-info/src/lib.rs',
              'official/codex/model-provider-auth.rs': f'https://raw.githubusercontent.com/openai/codex/{CODEX_COMMIT}/codex-rs/model-provider/src/auth.rs',
          }

          for rel, url in downloads.items():
              p = root / rel
              p.parent.mkdir(parents=True, exist_ok=True)
              req = urllib.request.Request(url, headers={'User-Agent': 'codex-responses-truth-base'})
              with urllib.request.urlopen(req, timeout=120) as r:
                  data = r.read()
              if not data:
                  raise RuntimeError(f'empty download: {url}')
              p.write_bytes(data)
              print(rel, len(data))

          spec = json.loads((root/'official/openapi/openapi.json').read_text())
          response_paths = {k:v for k,v in spec.get('paths',{}).items() if k.startswith('/responses')}

          refs = set()
          def collect_refs(x):
              if isinstance(x, dict):
                  ref = x.get('$ref')
                  if isinstance(ref, str) and ref.startswith('#/components/'):
                      refs.add(ref)
                  for v in x.values(): collect_refs(v)
              elif isinstance(x, list):
                  for v in x: collect_refs(v)

          collect_refs(response_paths)
          resolved = {}
          queue = list(refs)
          seen = set()
          while queue:
              ref = queue.pop()
              if ref in seen: continue
              seen.add(ref)
              parts = ref[2:].split('/')
              node = spec
              ok = True
              for part in parts:
                  if isinstance(node, dict) and part in node:
                      node = node[part]
                  else:
                      ok = False
                      break
              if not ok: continue
              resolved[ref] = node
              before = set(refs)
              collect_refs(node)
              for new_ref in refs - before:
                  if new_ref not in seen:
                      queue.append(new_ref)

          (root/'responses').mkdir(exist_ok=True)
          (root/'responses/paths.json').write_text(json.dumps(response_paths, indent=2, sort_keys=True) + '\n')
          (root/'responses/components.json').write_text(json.dumps(resolved, indent=2, sort_keys=True) + '\n')
          subset = {
              'openapi': spec.get('openapi'),
              'info': spec.get('info'),
              'servers': spec.get('servers'),
              'paths': response_paths,
              'components_by_ref': resolved,
          }
          (root/'responses/openapi-responses.json').write_text(json.dumps(subset, indent=2, sort_keys=True) + '\n')
          (root/'sources.json').write_text(json.dumps({
              'openai_openapi_commit': OPENAPI_COMMIT,
              'openai_codex_commit': CODEX_COMMIT,
              'downloads': downloads,
          }, indent=2, sort_keys=True) + '\n')
          PY
      - name: Commit downloaded files
        run: |
          git config user.name "reference-bootstrap"
          git config user.email "actions@users.noreply.github.com"
          git add README.md sources.json official responses
          git commit -m "Download official OpenAI reference files" || exit 0
          git push
