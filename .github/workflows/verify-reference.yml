name: Verify reference base

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install schema parser
        run: python -m pip install --disable-pip-version-check PyYAML
      - name: Verify upstream hashes
        run: python scripts/verify_hashes.py
      - name: Verify derived schema provenance
        run: python scripts/verify_derived_artifacts.py
      - name: Verify fixture labeling
        run: python tests/fixture-validation/check.py
      - name: Strict TypeScript check
        run: npx --yes -p typescript@5.9.2 tsc artifacts/typescript/OpenAICodexResponses.ts --noEmit --strict --target ES2022 --module ES2022 --lib ES2022,DOM --skipLibCheck
