name: Sync official OpenAI truth

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.bootstrap/sync-trigger'

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install extraction dependency
        run: python -m pip install --disable-pip-version-check PyYAML
      - name: Fetch official snapshots
        run: python scripts/sync_official.py
      - name: Derive navigable schema
        run: python scripts/extract_responses_schema.py
      - name: Verify official hashes
        run: python scripts/verify_hashes.py
      - name: Verify derived provenance
        run: python scripts/verify_derived_artifacts.py
      - name: Commit synchronized truth snapshot
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'codex-responses-truth-sync'
          git config user.email 'actions@users.noreply.github.com'
          git add upstream schema
          if git diff --cached --quiet; then
            echo 'No snapshot changes.'
            exit 0
          fi
          git commit -m 'Sync official OpenAI truth snapshot'
          git push
